# Manual apply on main only (OIDC role trust is refs/heads/main).
# Run: Actions → 2. Terraform apply → choose env-1 / env-2 / both.

name: 2. Terraform apply

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment stack to apply
        type: choice
        required: true
        options:
          - env-1
          - env-2
          - both
        default: both

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-apply-main
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.7"
  AWS_REGION: ap-southeast-1

jobs:
  prepare:
    name: Resolve targets
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      envs: ${{ steps.set.outputs.envs }}
    steps:
      - id: set
        run: |
          set -euo pipefail
          if [ "${{ inputs.target }}" = "both" ]; then
            echo 'envs=["env-1","env-2"]' >> "$GITHUB_OUTPUT"
          else
            echo 'envs=["${{ inputs.target }}"]' >> "$GITHUB_OUTPUT"
          fi

  apply:
    name: Apply (${{ matrix.env }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        env: ${{ fromJSON(needs.prepare.outputs.envs) }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        run: terraform init -reconfigure -input=false -backend-config=${{ matrix.env }}.conf

      - name: terraform apply
        run: terraform apply -auto-approve -input=false -var-file=env/${{ matrix.env }}.tfvars

      - name: Summary
        run: |
          echo "### Applied \`${{ matrix.env }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend: \`${{ matrix.env }}.conf\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Vars: \`env/${{ matrix.env }}.tfvars\`" >> "$GITHUB_STEP_SUMMARY"
